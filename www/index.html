<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>GhostGPT</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111827; color: #f9fafb; }
      main { max-width: 30rem; padding: 2rem; text-align: center; }
      a { display:inline-block; margin-top:1rem; padding:.75rem 1rem; border-radius:.5rem; background:#2563eb; color:white; text-decoration:none; }
      #status { color:#cbd5e1; }
    </style>
  </head>
  <body>
    <main>
      <h1>GhostGPT</h1>
      <p id="status">Opening GhostGPT…</p>
      <a href="https://ghostgpt.live/chat/" rel="noopener">Open GhostGPT</a>
    </main>
    <script>
      const target = 'https://ghostgpt.live/chat/';
      const status = document.getElementById('status');
      window.setTimeout(() => {
        status.textContent = 'Connecting to the GhostGPT service…';
        window.location.assign(target);
      }, 250);
      window.addEventListener('error', () => {
        status.textContent = 'The GhostGPT service could not be opened. Check your connection and tap Open GhostGPT.';
      });
    </script>
  </body>
</html>
