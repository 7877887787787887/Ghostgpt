name: Build GhostGPT KitKat Root and Wireless ADB tools
on:
  push:
    branches: [main, "feature/ghostgpt-kitkat-*"]
    paths: ["android-kitkat-tools/**", ".github/workflows/build-android-kitkat-tools.yml"]
  pull_request:
    branches: [main]
    paths: ["android-kitkat-tools/**", ".github/workflows/build-android-kitkat-tools.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghostgpt-kitkat-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build root and wireless apps
        run: gradle --no-daemon -p android-kitkat-tools :rootapp:assembleDebug :wirelessapp:assembleDebug
      - name: Verify KitKat APKs and signature
        run: |
          set -euo pipefail
          for module in rootapp wirelessapp; do
            apk="android-kitkat-tools/$module/build/outputs/apk/debug/$module-debug.apk"
            test -s "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 19 --verbose "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee "/tmp/$module-badging.txt"
            grep -F "sdkVersion:'19'" "/tmp/$module-badging.txt"
            sha256sum "$apk" > "$apk.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: GhostGPT-KitKat-Root-WirelessADB-APKs
          path: |
            android-kitkat-tools/rootapp/build/outputs/apk/debug/*.apk
            android-kitkat-tools/rootapp/build/outputs/apk/debug/*.sha256
            android-kitkat-tools/wirelessapp/build/outputs/apk/debug/*.apk
            android-kitkat-tools/wirelessapp/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
          retention-days: 30
