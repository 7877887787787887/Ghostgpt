name: Build GhostGPT Android KitKat 4.4 APK
on:
  push:
    branches: [main, "feature/ghostgpt-kitkat-*"]
    paths: ["android-kitkat/**", ".github/workflows/build-android-kitkat-apk.yml"]
  pull_request:
    branches: [main]
    paths: ["android-kitkat/**", ".github/workflows/build-android-kitkat-apk.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghostgpt-kitkat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kitkat-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Android 4.4 APK
        run: gradle --no-daemon -p android-kitkat :app:assembleDebug
      - name: Verify Android 4.4 compatibility and signature
        run: |
          set -euo pipefail
          apk=android-kitkat/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee /tmp/kitkat-badge.txt
          grep -F "sdkVersion:'19'" /tmp/kitkat-badge.txt
          grep -F "name='io.corelo.ghostgpt.kitkat'" /tmp/kitkat-badge.txt
          sha256sum "$apk" > android-kitkat/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GhostGPT-KitKat-Android4.4-debug
          path: |
            android-kitkat/app/build/outputs/apk/debug/app-debug.apk
            android-kitkat/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
