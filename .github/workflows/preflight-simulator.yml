name: GhostGPT preflight and simulator smoke tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostgpt-preflight-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Unit tests and simulator launch
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Python gateway unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Source and security guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -s ios-native/AppDelegate.swift
          test -s ios-native/SceneDelegate.swift
          test -s ios-native/verify-simulator-screen.swift
          grep -q 'enum LocalModelClient' ios-native/SceneDelegate.swift
          grep -q 'private func startPCModelOnAppOpen' ios-native/SceneDelegate.swift
          grep -q 'private func checkGatewayConnection' ios-native/SceneDelegate.swift
          grep -q 'private func runOllamaAgent' ios-native/SceneDelegate.swift
          grep -q 'aiTerminalToolsEnabled' ios-native/SceneDelegate.swift
          grep -q 'riskConfirmed' ios-native/SceneDelegate.swift
          grep -q 'tool_calls' ios-native/SceneDelegate.swift
          grep -q 'def authorize_request' windows/lmstudio_gateway.py
          grep -q 'hmac.compare_digest' windows/lmstudio_gateway.py
          grep -q 'StrictHostKeyChecking=yes' windows/lmstudio_gateway.py
          ! grep -q '@AppStorage("terminalGatewayToken")' ios-native/SceneDelegate.swift
          ! grep -q '@AppStorage("localModelAPIKey")' ios-native/SceneDelegate.swift

      - name: Generate iOS project
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          cp ios-native/AppDelegate.swift ios/App/App/AppDelegate.swift
          cp ios-native/SceneDelegate.swift ios/App/App/SceneDelegate.swift
          rm -rf ios/App/App/public
          mkdir -p ios/App/App/public
          test ! -e ios/App/App/public/index.html

      - name: Build simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator IPHONEOS_DEPLOYMENT_TARGET=17.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          test -d build/simulator/Build/Products/Debug-iphonesimulator/App.app

      - name: Boot latest iOS 27 simulator and validate iPhone 15 / 16 Pro Max compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          def call(args, timeout=60):
              p = subprocess.run(args, capture_output=True, text=True, timeout=timeout)
              if p.returncode:
                  print(f"FAILED ({p.returncode}): {' '.join(args)}", file=sys.stderr)
                  print(p.stdout, file=sys.stderr)
                  print(p.stderr, file=sys.stderr)
                  raise SystemExit(p.returncode)
              return p.stdout

          runtimes = json.loads(call(["xcrun", "simctl", "list", "runtimes", "--json"]))["runtimes"]
          ios27 = [r for r in runtimes if r.get("isAvailable") and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-27-")]
          if not ios27:
              raise SystemExit("No available iOS 27 simulator runtime.")
          runtime = sorted(ios27, key=lambda r: tuple(map(int, re.findall(r"\d+", r.get("version", "0")))))[-1]
          runtime_id = runtime["identifier"]
          print(f"Latest iOS runtime: {runtime.get('version')} ({runtime_id})", flush=True)

          device_types = json.loads(call(["xcrun", "simctl", "list", "devicetypes", "--json"]))["devicetypes"]
          requested = {
              "iPhone 15": "com.apple.CoreSimulator.SimDeviceType.iPhone-15",
              "iPhone 16 Pro Max": "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max",
          }
          available = {d["identifier"]: d for d in device_types}
          for label, identifier in requested.items():
              if identifier not in available:
                  print(f"DEVICE TYPE MISSING: {label} ({identifier})", flush=True)
              else:
                  print(f"DEVICE TYPE PRESENT: {label}", flush=True)

          # simctl device-type inventory is global; not every listed type can
          # be paired with every runtime. Ask CoreSimulator to create each
          # requested model, but treat Apple's explicit 'Incompatible device'
          # response as a runtime capability limitation, not an app failure.
          compatible_requested = []
          for label, identifier in requested.items():
              if identifier not in available:
                  continue
              p = subprocess.run(["xcrun", "simctl", "create", f"GhostGPT {label} iOS 27", identifier, runtime_id],
                                 capture_output=True, text=True, timeout=90)
              if p.returncode == 0 and p.stdout.strip():
                  compatible_requested.append((label, p.stdout.strip()))
              elif "Incompatible device" in p.stderr or "Incompatible device" in p.stdout:
                  print(f"NOT SUPPORTED by installed iOS {runtime.get('version')} runtime: {label}", flush=True)
              else:
                  print(p.stdout, file=sys.stderr)
                  print(p.stderr, file=sys.stderr)
                  raise SystemExit(f"CoreSimulator could not provision {label} (exit {p.returncode})")

          # If iOS 27 no longer offers the requested legacy device profiles,
          # smoke-test on the newest iPhone profile that this runtime supports.
          devices = compatible_requested
          if not devices:
              all_devices = json.loads(call(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
              runtime_devices = all_devices.get(runtime_id, [])
              candidates = [d for d in runtime_devices if d.get("isAvailable")]
              if not candidates:
                  raise SystemExit(f"No bootable iPhone simulator devices exist for iOS {runtime.get('version')}.")
              # Prefer the most recent iPhone model available in this runtime.
              def model_rank(d):
                  m = re.search(r"iPhone (\d+)", d.get("name", ""))
                  return int(m.group(1)) if m else -1
              candidates.sort(key=model_rank, reverse=True)
              devices = [(candidates[0]["name"], candidates[0]["udid"])]

          def run(label, args, timeout):
              print(f"Running {label}: {' '.join(args)}", flush=True)
              try:
                  p = subprocess.run(args, timeout=timeout, check=False)
              except subprocess.TimeoutExpired:
                  raise SystemExit(f"Timed out during {label} after {timeout}s")
              if p.returncode:
                  raise SystemExit(f"{label} failed with exit code {p.returncode}")

          for label, udid in devices:
              print(f"\n=== Smoke test: {label} / iOS {runtime.get('version')} ===", flush=True)
              run(f"{label} boot", ["xcrun", "simctl", "boot", udid], 60)
              run(f"{label} boot readiness", ["xcrun", "simctl", "bootstatus", udid, "-b"], 420)
              run(f"{label} app install", ["xcrun", "simctl", "install", udid,
                                            "build/simulator/Build/Products/Debug-iphonesimulator/App.app"], 120)
              run(f"{label} app launch", ["xcrun", "simctl", "launch", udid, "io.corelo.ghostgpt",
                                           "-modelProvider", "Cloudflare", "-autoStartPCModel", "false"], 90)
              time.sleep(3)
              screenshot = f"simulator-smoke-{label.lower().replace(' ', '-')}.png"
              run(f"{label} screenshot", ["xcrun", "simctl", "io", udid, "screenshot", screenshot], 45)
              path = Path(screenshot)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"{label} screenshot missing or empty")
              run(f"{label} screen verification",
                  ["swift", "ios-native/verify-simulator-screen.swift", screenshot], 180)

          print("\nAll iOS 27 simulator smoke tests completed.", flush=True)
          PY

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GhostGPT-simulator-smoke
          path: simulator-smoke-*.png
          if-no-files-found: ignore
          retention-days: 7
