name: GhostGPT preflight and simulator smoke tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostgpt-preflight-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Unit tests and simulator launch
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Python gateway unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Source and security guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -s ios-native/AppDelegate.swift
          test -s ios-native/SceneDelegate.swift
          test -s ios-native/verify-simulator-screen.swift
          grep -q 'enum LocalModelClient' ios-native/SceneDelegate.swift
          grep -q 'private func startPCModelOnAppOpen' ios-native/SceneDelegate.swift
          grep -q 'private func checkGatewayConnection' ios-native/SceneDelegate.swift
          grep -q 'private func runOllamaAgent' ios-native/SceneDelegate.swift
          grep -q 'aiTerminalToolsEnabled' ios-native/SceneDelegate.swift
          grep -q 'riskConfirmed' ios-native/SceneDelegate.swift
          grep -q 'tool_calls' ios-native/SceneDelegate.swift
          grep -q 'def authorize_request' windows/lmstudio_gateway.py
          grep -q 'hmac.compare_digest' windows/lmstudio_gateway.py
          grep -q 'StrictHostKeyChecking=yes' windows/lmstudio_gateway.py
          ! grep -q '@AppStorage("terminalGatewayToken")' ios-native/SceneDelegate.swift
          ! grep -q '@AppStorage("localModelAPIKey")' ios-native/SceneDelegate.swift

      - name: Generate iOS project
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          cp ios-native/AppDelegate.swift ios/App/App/AppDelegate.swift
          cp ios-native/SceneDelegate.swift ios/App/App/SceneDelegate.swift
          rm -rf ios/App/App/public
          mkdir -p ios/App/App/public
          test ! -e ios/App/App/public/index.html

      - name: Build simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator IPHONEOS_DEPLOYMENT_TARGET=17.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          test -d build/simulator/Build/Products/Debug-iphonesimulator/App.app

      - name: Boot simulator and smoke-test app launch
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | sed -nE 's/.*iPhone[^()]*\(([0-9A-F-]{36})\).*/\1/p' | head -n 1)"
          if [[ -z "$DEVICE_ID" ]]; then
            echo "No available iPhone simulator runtime was found."
            xcrun simctl list devices available
            exit 1
          fi
          export DEVICE_ID
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          device = os.environ["DEVICE_ID"]

          def run(label, args, timeout):
              print(f"Running {label} (timeout={timeout}s): {' '.join(args)}", flush=True)
              try:
                  result = subprocess.run(args, timeout=timeout, check=False)
              except subprocess.TimeoutExpired:
                  print(f"Timed out during {label} after {timeout}s", file=sys.stderr, flush=True)
                  sys.exit(124)
              if result.returncode != 0:
                  print(f"{label} failed with exit code {result.returncode}", file=sys.stderr, flush=True)
                  sys.exit(result.returncode or 1)

          # Boot may report that the device is already booted; that is harmless.
          try:
              subprocess.run(["xcrun", "simctl", "boot", device], timeout=30,
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
          except subprocess.TimeoutExpired:
              print("Timed out while requesting simulator boot", file=sys.stderr, flush=True)
              sys.exit(124)

          run("simulator boot", ["xcrun", "simctl", "bootstatus", device, "-b"], 180)
          run("app install", ["xcrun", "simctl", "install", device,
                              "build/simulator/Build/Products/Debug-iphonesimulator/App.app"], 120)
          # CI runners are not on the user's private Tailscale network. Select the
          # cloud provider for this launch so smoke testing doesn't make a real
          # PC-gateway request or misreport missing tailnet access as an app failure.
          run("app launch", ["xcrun", "simctl", "launch", device, "io.corelo.ghostgpt",
                             "-modelProvider", "Cloudflare", "-autoStartPCModel", "false"], 45)
          time.sleep(2)
          run("screenshot capture", ["xcrun", "simctl", "io", device, "screenshot",
                                     "simulator-smoke.png"], 45)
          if not Path("simulator-smoke.png").is_file() or Path("simulator-smoke.png").stat().st_size == 0:
              print("Simulator screenshot is missing or empty", file=sys.stderr, flush=True)
              sys.exit(1)
          run("Vision screen text verification",
              ["swift", "ios-native/verify-simulator-screen.swift", "simulator-smoke.png"], 60)
          PY
        continue-on-error: false

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GhostGPT-simulator-smoke
          path: simulator-smoke.png
          if-no-files-found: ignore
          retention-days: 7
