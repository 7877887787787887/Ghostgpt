name: Build native unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build, launch, and package native SwiftUI app
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate native app sources
        shell: bash
        run: |
          set -euo pipefail
          test -s ios-native/AppDelegate.swift
          test -s ios-native/SceneDelegate.swift
          test -s ios-native/verify-simulator-screen.swift
          grep -q 'configuration.delegateClass = SceneDelegate.self' ios-native/AppDelegate.swift
          grep -q 'UIHostingController(rootView: GhostGPTRootView())' ios-native/SceneDelegate.swift
          ! grep -q 'Open GhostGPT' ios-native/*.swift

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate Capacitor iOS project
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios

      - name: Install native SwiftUI entry points and remove web UI
        shell: bash
        run: |
          set -euo pipefail
          cp ios-native/AppDelegate.swift ios/App/App/AppDelegate.swift
          cp ios-native/SceneDelegate.swift ios/App/App/SceneDelegate.swift
          rm -rf ios/App/App/public
          test ! -e ios/App/App/public/index.html

      - name: Build and launch on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator IPHONEOS_DEPLOYMENT_TARGET=16.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          simulator_app='build/simulator/Build/Products/Debug-iphonesimulator/App.app'
          test -d "$simulator_app"
          test ! -e "$simulator_app/public/index.html"
          device_id=$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPhone")))')
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$simulator_app"
          xcrun simctl launch "$device_id" io.corelo.ghostgpt
          sleep 3
          mkdir -p artifacts
          xcrun simctl io "$device_id" screenshot artifacts/native-launch.png
          swift ios-native/verify-simulator-screen.swift artifacts/native-launch.png

      - name: Build unsigned iOS device app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios IPHONEOS_DEPLOYMENT_TARGET=16.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build

      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path='build/ios/Build/Products/Release-iphoneos/App.app'
          test -d "$app_path"
          test ! -e "$app_path/public/index.html"
          if /usr/bin/codesign --verify --deep "$app_path" >/dev/null 2>&1; then
            echo 'Unexpected code signature found; refusing to label this artifact unsigned.'
            exit 1
          fi
          mkdir -p dist/Payload
          /usr/bin/ditto "$app_path" dist/Payload/App.app
          cd dist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload GhostGPT-native-unsigned.ipa
          test -s GhostGPT-native-unsigned.ipa
          /usr/bin/unzip -l GhostGPT-native-unsigned.ipa | grep -q 'Payload/App.app/'
          if /usr/bin/unzip -l GhostGPT-native-unsigned.ipa | grep -Eqi 'Payload/App.app/.*\.html'; then
            echo 'Legacy web UI unexpectedly included in native app bundle.'
            exit 1
          fi
          /usr/bin/shasum -a 256 GhostGPT-native-unsigned.ipa

      - name: Upload native IPA
        uses: actions/upload-artifact@v4
        with:
          name: GhostGPT-native-unsigned-iOS-IPA
          path: dist/GhostGPT-native-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: GhostGPT-native-launch-screenshot
          path: artifacts/native-launch.png
          if-no-files-found: error
          retention-days: 14
